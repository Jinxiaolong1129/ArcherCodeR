# Intuitor-DAPO Alternating Training Configuration
# Alternates between Intuitor algorithm and DAPO training methodology

defaults:
  - ppo_trainer  # 继承基础配置
  - _self_       # 确保当前配置优先级最高

# 实验配置
trainer:
  experiment_name: intuitor_dapo_alternating
  project_name: ArcherCodeR
  logger: ['console', 'wandb']
  n_gpus_per_node: 8
  nnodes: 1
  balance_batch: false
  val_before_train: false
  test_freq: 10
  save_freq: 10
  total_epochs: 10
  resume_mode: auto
  critic_warmup: 0
  max_actor_ckpt_to_keep: 2
  max_critic_ckpt_to_keep: 2

# Intuitor-DAPO 交替训练配置
alternating:
  modes: ["intuitor", "dapo"]
  steps_per_phase: 50
  start_mode: "intuitor"
  
  # DAPO 特定设置
  dapo_rejection_sample: true
  dapo_enable_overlong_filter: true

# 基础模型配置
actor_rollout_ref:
  model:
    path: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
    enable_gradient_checkpointing: true
    use_remove_padding: true
    
  actor:
    strategy: fsdp
    optim:
      lr: 1e-6
      weight_decay: 0.1
    ppo_epochs: 2  # 平衡 Intuitor(1) 和 DAPO(3) 的设置
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 1
    grad_clip: 1.0
    entropy_coeff: 0
    use_kl_loss: false
    fsdp_config:
      param_offload: false
      optimizer_offload: false
      
  rollout:
    name: vllm
    gpu_memory_utilization: 0.75
    tensor_model_parallel_size: 2
    enable_chunked_prefill: true
    max_model_len: 10240
    max_num_batched_tokens: 10240
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    n: 16
    val_kwargs:
      n: 4
      do_sample: true
      temperature: 0.8
      top_p: 1.0
      top_k: -1
      response_length: 8192

# 算法配置 (会根据模式动态切换)
algorithm:
  adv_estimator: intuitor  # 初始算法
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: true
  kl_ctrl:
    type: fixed
    kl_coef: 0.0
    horizon: 10000
    target_kl: 0.1

# 数据配置
data:
  train_files: ./data/train/archercoder-1.5b-train.json
  val_files: ./data/test/livecodebench_v5.json
  prompt_key: prompt
  train_batch_size: 64
  gen_batch_size: 64
  max_prompt_length: 2048
  max_response_length: 8192
  filter_overlong_prompts: true
  truncation: 'error'
  reward_fn_key: data_source

# 奖励模型配置
reward_model:
  enable: false  # 使用函数式奖励
  reward_manager: wizard  # 支持代码和数学任务
  overlong_buffer:
    enable: false
    len: 16
    penalty_factor: 1.0

# Critic配置 (根据算法自动决定是否使用)
critic:
  strategy: fsdp

# Ray配置
ray_init:
  num_cpus: null
